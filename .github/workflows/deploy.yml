name: Deploy

# Builds the site once, then:
#  - publishes it to AWS (S3 + CloudFront) as zumodeia.com, and
#  - turns GitHub Pages (f-n-ll.github.io) into a redirect to it.
# Until the repo variable AWS_ROLE_ARN is set, Pages keeps serving the full
# site and the AWS job is skipped, so nothing breaks mid-migration.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ON_AWS: ${{ vars.AWS_ROLE_ARN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  aws:
    needs: build
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject to
    # repo:…:environment:…, and the AWS role trusts repo:…:ref:refs/heads/main.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload
        env:
          B: s3://${{ vars.AWS_BUCKET }}
        run: |
          # hashed build assets never change: cache for a year
          aws s3 sync dist/_astro "$B/_astro" --delete --cache-control "public,max-age=31536000,immutable"
          # images, icons, fonts: a day
          aws s3 sync dist "$B" --delete --exclude "_astro/*" --exclude "*.html" --cache-control "public,max-age=86400"
          # pages last, always revalidated, so a deploy shows up immediately
          aws s3 sync dist "$B" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths "/*" --query Invalidation.Id --output text

  pages-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Redirect stub (once the site lives on AWS)
        if: env.ON_AWS == 'true'
        run: |
          rm -rf dist && mkdir dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Daniel Fenoll — moved to zumodeia.com</title>
              <link rel="canonical" href="https://zumodeia.com/" />
              <meta name="robots" content="noindex" />
              <meta http-equiv="refresh" content="0; url=https://zumodeia.com/" />
              <script>location.replace('https://zumodeia.com' + location.pathname + location.search + location.hash);</script>
            </head>
            <body><p>Moved to <a href="https://zumodeia.com/">zumodeia.com</a>.</p></body>
          </html>
          HTML
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
