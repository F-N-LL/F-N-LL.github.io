name: Deploy

# Two environments, one per branch:
#  - main → Release: AWS (S3 + CloudFront) at zumodeia.com
#  - dev  → Dev:     GitHub Pages at f-n-ll.github.io (noindex, canonical → zumodeia.com)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ github.ref_name == 'main' && 'https://zumodeia.com' || 'https://f-n-ll.github.io' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  release:
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject to
    # repo:…:environment:…, and the AWS role trusts repo:…:ref:refs/heads/main.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload
        env:
          B: s3://${{ vars.AWS_BUCKET }}
        run: |
          # hashed build assets never change: cache for a year
          aws s3 sync dist/_astro "$B/_astro" --delete --cache-control "public,max-age=31536000,immutable"
          # images, icons, fonts: a day
          aws s3 sync dist "$B" --delete --exclude "_astro/*" --exclude "*.html" --cache-control "public,max-age=86400"
          # pages last, always revalidated, so a deploy shows up immediately
          aws s3 sync dist "$B" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths "/*" --query Invalidation.Id --output text

  dev:
    needs: build
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
