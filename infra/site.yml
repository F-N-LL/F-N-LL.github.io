AWSTemplateFormatVersion: '2010-09-09'
Description: >
  zumodeia.com, step 2 of 2: private S3 bucket behind CloudFront (HTTPS via a
  free ACM certificate), DNS records, and a GitHub Actions deploy role that
  needs no stored keys. Deploy in us-east-1 (CloudFront certificates must
  live there). Run only after the nameservers from step 1 are live.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  DomainName:
    Type: String
    Default: zumodeia.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: HostedZoneId output of the zone stack.
  GitHubRepo:
    Type: String
    Default: F-N-LL/F-N-LL.github.io
    Description: owner/repo allowed to deploy (main branch only).
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: false if the account already has the GitHub OIDC provider.

Conditions:
  MakeOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # ── HTTPS certificate (free, auto-renewing, validated through Route 53) ──
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: Free auto-renewing TLS for apex and www, validated by records CloudFormation writes into the zone.
        must: Must be in us-east-1 to attach to CloudFront.
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  # ── Storage: private; only this CloudFront distribution can read it ──
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds the built static site. Private; only the distribution below may read it.
        must: Never enable public access or S3 website hosting; CloudFront with OAC is the only reader.
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: 'false' }
          - Sid: AllowThisDistributionOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # www → apex, and /path/ → /path/index.html (ready for future pages)
  EdgeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-edge'
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect and directory index
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host && req.headers.host.value;
          if (host && host.indexOf('www.') === 0) {
            var qs = Object.keys(req.querystring).map(function (k) {
              return k + '=' + req.querystring[k].value;
            }).join('&');
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + req.uri + (qs ? '?' + qs : '') } },
            };
          }
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          else if (req.uri.split('/').pop().indexOf('.') === -1) req.uri += '/index.html';
          return req;
        }

  # ── CDN + HTTPS ──
  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves the site over HTTPS on zumodeia.com and www, from the private bucket via OAC.
        must: Keep PriceClass_100 (cost) and redirect-to-https.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100 # Europe + North America edges: cheapest, fine for Spain
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EdgeFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # a private bucket answers 403 for missing keys: show the site, as a 404
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

  # ── DNS: apex and www both point at CloudFront (IPv4 + IPv6) ──
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ── Deploys from GitHub Actions with short-lived credentials (OIDC) ──
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: GitHub Actions assumes this via OIDC to upload and invalidate; no long-lived keys exist.
        must: Trust only this repo's main branch; permissions stay limited to this bucket and distribution.
    Properties:
      Description: !Sub 'GitHub Actions deploys ${GitHubRepo} (main) to ${DomainName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
